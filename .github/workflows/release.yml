name: Release

# Builds flumi binaries and publishes them on the GitHub Release for a tag.
# Runs when a v* tag is pushed, or by hand (Actions > Release > Run workflow)
# for a tag that already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.16.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      # Linking against glibc 2.17 lets the binary run on any Linux from
      # RHEL/CentOS 7 onwards. zig's clang needs evex512 spelled out for
      # libdeflate's runtime-dispatched AVX-512 code; baseline code stays
      # plain x86-64.
      - name: Build
        env:
          CFLAGS_x86_64_unknown_linux_gnu: -mevex512
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
          mkdir -p out
          cp target/${{ matrix.target }}/release/flumi out/
      - name: Check glibc requirement
        run: |
          need=$(objdump -T out/flumi | grep -o 'GLIBC_[0-9.]*' | sort -t. -k2,2n -k3,3n -u | tail -1)
          echo "needs $need"
          test "$(printf '%s\n' GLIBC_2.17 "$need" | sort -V | tail -1)" = GLIBC_2.17
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: out/flumi --version
      - name: Package
        run: |
          name="flumi-${TAG}-${{ matrix.target }}"
          mkdir -p "pkg/$name" dist
          cp out/flumi README.md LICENSE CHANGELOG.md "pkg/$name/"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: flumi-${{ matrix.target }}
          path: dist/*

  macos:
    name: macOS (arm64 + x86_64)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t"
            mkdir -p "out-$t"
            cp "target/$t/release/flumi" "out-$t/"
          done
          file out-*/flumi
          out-aarch64-apple-darwin/flumi --version
      - name: Package
        run: |
          mkdir -p dist
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            name="flumi-${TAG}-$t"
            mkdir -p "pkg/$name"
            cp "out-$t/flumi" README.md LICENSE CHANGELOG.md "pkg/$name/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flumi-macos
          path: dist/*

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '/^## /{f=($2==v); next} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "flumi $version" > notes.md
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "flumi $version" --notes-file notes.md
          fi
